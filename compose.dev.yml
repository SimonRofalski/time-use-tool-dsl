# Local development only. The DSL runs the same PostgreSQL version as its own container in the app's
# stack (db/bootstrap/Dockerfile, deploy/dsl/); both run db/bootstrap/bootstrap.sql on the first start.
#
#   npm run db:up      start (first start runs the bootstrap on the empty volume)
#   npm run db:reset   wipe the volume, bootstrap, migrate, seed
#
# The passwords below are local dev passwords; the port is bound to 127.0.0.1 only.
name: time-use-tool-dev

services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_PASSWORD: postgres            # local superuser, used only for the bootstrap
      TUT_LOCAL_OWNER_PASSWORD: tut_local_owner_pw
      TUT_LOCAL_APP_PASSWORD: tut_local_app_pw
      TUT_LOCAL_SERVICE_PASSWORD: tut_local_service_pw
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - tut_pgdata:/var/lib/postgresql/data
      - ./db/bootstrap:/bootstrap:ro
      - ./db/bootstrap/local-init.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tut_local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tut_pgdata:
