# Builds the two container images of this repository and pushes them to the container registry of
# the GitLab project. Runs in the BFH GitLab, which pull-mirrors this repository from GitHub (the
# mirror setting "Trigger pipelines for mirror updates" must be on). GitHub Actions (.github/) keeps
# running the tests; this pipeline only builds and pushes. No secrets in this file: the registry login
# comes from GitLab's predefined job variables.
#
# Images (as used in deploy/dsl/<test|prod>/compose.yml):
#   $CI_REGISTRY_IMAGE/app   app + migration job   (Dockerfile, context .)
#   $CI_REGISTRY_IMAGE/db    PostgreSQL + bootstrap (db/bootstrap/Dockerfile, context db/bootstrap)
#
# Tags:
#   every build                       :<short commit sha>
#   newest commit of TEST_BRANCH      :test       -> test environment
#   git tag vX.Y.Z (release)          :vX.Y.Z     -> production pins this version in its compose file
#
# Builder: kaniko, the maintained community fork (osscontainertools/kaniko; the original Google
# project is archived). It needs no privileged runner, no Docker daemon and no runner changes, and
# comes from ghcr.io (no Docker Hub rate limit for the builder itself).

stages:
  - build

variables:
  # branch whose newest build becomes the :test image (test environment); can be overridden
  # as a CI/CD variable of the project
  TEST_BRANCH: "main"
  # "true": pull the base images (node, postgres) through the GitLab dependency proxy of the group,
  # if Docker Hub's pull limit for anonymous pulls (100 per 6 h and IP) becomes a problem
  USE_DEPENDENCY_PROXY: "false"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $TEST_BRANCH && $CI_COMMIT_BRANCH == $TEST_BRANCH

.kaniko:
  stage: build
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.28.6-debug
    entrypoint: [""]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]
  script:
    - |
      set -eu
      mkdir -p /kaniko/.docker
      REG_AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      BASE_ARG=""
      if [ "$USE_DEPENDENCY_PROXY" = "true" ]; then
        DP_AUTH=$(printf '%s:%s' "$CI_DEPENDENCY_PROXY_USER" "$CI_DEPENDENCY_PROXY_PASSWORD" | base64 | tr -d '\n')
        printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}' \
          "$CI_REGISTRY" "$REG_AUTH" "$CI_DEPENDENCY_PROXY_SERVER" "$DP_AUTH" > /kaniko/.docker/config.json
        # same base image as the ARG default in the Dockerfile, only fetched through the proxy
        BASE=$(sed -n "s/^ARG ${BASE_IMAGE_ARG}=//p" "$CI_PROJECT_DIR/$DOCKERFILE" | head -n 1)
        BASE_ARG="--build-arg=${BASE_IMAGE_ARG}=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/${BASE}"
      else
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$REG_AUTH" > /kaniko/.docker/config.json
      fi

      TAGS="$CI_COMMIT_SHORT_SHA"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then TAGS="$TAGS $CI_COMMIT_TAG"; fi
      if [ -n "${CI_COMMIT_BRANCH:-}" ] && [ "$CI_COMMIT_BRANCH" = "$TEST_BRANCH" ]; then TAGS="$TAGS test"; fi
      DESTS=""
      for t in $TAGS; do DESTS="$DESTS --destination=$IMAGE:$t"; done

      echo "building $IMAGE, tags: $TAGS"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR/$CONTEXT" \
        --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        $BASE_ARG $DESTS

app-image:
  extends: .kaniko
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/app
    CONTEXT: "."
    DOCKERFILE: Dockerfile
    BASE_IMAGE_ARG: NODE_IMAGE

db-image:
  extends: .kaniko
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/db
    CONTEXT: db/bootstrap
    DOCKERFILE: db/bootstrap/Dockerfile
    BASE_IMAGE_ARG: POSTGRES_IMAGE
